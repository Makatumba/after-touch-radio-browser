<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f2" />
    <!--
      Local shell CSP (Android Cordova wrapper).
      The shell runs from file:// (AndroidInsecureFileModeEnabled), so the
      file: scheme is listed explicitly wherever 'self' cannot be relied upon.
      Audited against the web app's real traffic:
        - connect-src: GitHub Pages (manifest + hashed assets), the pinned Radio
          Browser API host, and cleartext http/ws for LAN speakers (dynamic
          private IPs — protocol-wide rules are required and documented in
          README.md #security).
        - img-src / media-src: arbitrary station favicon/artwork/stream hosts on
          both schemes (Radio Browser data is user-contributed; documented risk).
        - script-src: local files plus the pinned GitHub Pages origin. No
          'unsafe-eval' — add it ONLY if a device test proves the toolchain
          needs it (see README testing checklist).
        - style-src: inline boot styles plus the remote stylesheet origin.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' file: data: blob: https://makatumba.github.io;
                   connect-src 'self' file: blob: https://makatumba.github.io https://de1.api.radio-browser.info http://*:* ws://*:* wss://*:*;
                   img-src 'self' file: data: blob: http://* https://*;
                   media-src 'self' file: data: blob: http://* https://*;
                   style-src 'self' 'unsafe-inline' file: https://makatumba.github.io;
                   script-src 'self' 'unsafe-inline' file: https://makatumba.github.io;
                   font-src 'self' file: data:" />

    <title>AfterTouch radio browser</title>

    <script>
        window.__AFTER_TOUCH_RUNTIME__ = 'cordova';
    </script>
    <script src="cordova.js"></script>
    <script defer src="loader.js"></script>

    <style>
        :root { color-scheme: light; background: #f7f6f2; }
        html, body, #app-shell { min-height: 100%; margin: 0; }
        body {
            background: #f7f6f2;
            color: #1c1b18;
            font-family: system-ui, sans-serif;
        }
        #boot { min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; }
        #boot-card { max-width: 30rem; }
        #boot-message { margin: 0 0 16px; color: #55534d; }
        #boot-retry { padding: 10px 16px; font: inherit; }
        #boot-retry[hidden] { display: none; }
    </style>
</head>
<body>
    <div id="app-shell">
        <div id="boot" role="status" aria-live="polite">
            <div id="boot-card">
                <p id="boot-message">Loading After Touch Radio Browser…</p>
                <button id="boot-retry" type="button" hidden>Retry</button>
            </div>
        </div>

        <!-- Exact mount node expected by the web app (src/app.ts render target). -->
        <div id="app"></div>
    </div>
</body>
</html>
